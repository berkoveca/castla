# Robolectric 4.11.1 only ships android-all jars up to SDK 34. Without this,
# tests inherit targetSdk/compileSdk 35 and break at class-load time with
# "DefaultSdkPicker.java:118 IllegalArgumentException". Pin the default runtime
# SDK to 34; tests that explicitly set a lower @Config(sdk=...) still override.
sdk=34