name: Build Castla APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Bundle cloudflared binary
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fsSL -o app/src/main/jniLibs/arm64-v8a/libcloudflared.so \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64"
          chmod +x app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: castla-cloudflare-debug
          path: app/build/outputs/apk/debug/*.apk
