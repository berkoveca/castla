name: Build Castla APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Google removed the legacy "tools" package from the SDK repository, so
          # skip it; platforms/build-tools are preinstalled on the runner image and
          # gradle auto-downloads anything else.
          packages: platform-tools

      - name: Bundle cloudflared binary
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          # Termux packages a cloudflared linked against Android's bionic libc
          # (NEEDED libc/libdl/liblog), so it resolves DNS through the system
          # resolver (netd) exactly like a normal app. The official static
          # linux-arm64 release does its own DNS and cannot read /etc/resolv.conf
          # on Android (it does not exist), making quick tunnels fail with
          # "connection refused" to loopback :53. So pull the Termux package.
          curl -fsSL https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages -o packages.idx
          DEB=$(awk '/^Package: cloudflared$/{c=1} c && /^Filename:/{print $2; exit}' packages.idx)
          curl -fsSL "https://packages.termux.dev/apt/termux-main/$DEB" -o cloudflared.deb
          mkdir -p deb && cd deb
          ar x ../cloudflared.deb
          tar -xJf data.tar.xz
          cd ..
          cp deb/data/data/com.termux/files/usr/bin/cloudflared app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: castla-cloudflare-debug
          path: app/build/outputs/apk/debug/*.apk
