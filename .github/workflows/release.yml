# Build & Publish signed Release APK
#
# How it works:
#   1. Push to master (merge PR) → triggers this workflow
#   2. Checks the merged PR's labels to decide version bump:
#        - "major" label  → 1.2.3 → 2.0.0
#        - "minor" label  → 1.2.3 → 1.3.0
#        - "patch" label  → 1.2.3 → 1.2.4  (also the default fallback)
#        - "chore" label  → no release (CI housekeeping, docs, relicense, etc.)
#   3. Decodes your keystore from a GitHub secret
#   4. Builds a signed release APK with the new version
#   5. Creates a GitHub Release with the APK attached
#
# Required repository secrets:
#   - KEYSTORE_BASE64    : base64-encoded keystore file  (base64 -i your.keystore | pbcopy)
#   - KEYSTORE_PASSWORD  : keystore password
#   - KEY_ALIAS          : signing key alias
#   - KEY_PASSWORD       : signing key password

name: Build & Release APK

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      type: ${{ steps.bump.outputs.type }}
    steps:
      - name: Detect bump type from merged PR labels
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the PR associated with this merge commit
          COMMIT_SHA="${{ github.sha }}"
          LABELS=$(gh pr list --state merged --search "$COMMIT_SHA" --repo "${{ github.repository }}" --json labels -q '.[0].labels[].name' 2>/dev/null || echo "")

          if echo "$LABELS" | grep -qi "chore"; then
            echo "type=chore" >> "$GITHUB_OUTPUT"
            echo "Chore PR — skipping release"
          elif echo "$LABELS" | grep -qi "major"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -qi "minor"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi
          echo "Bump type: $(grep type "$GITHUB_OUTPUT" | cut -d= -f2)"

  build:
    needs: detect
    if: needs.detect.outputs.type != 'chore'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the highest existing semver tag/release, not just the first row from gh release list.
          # gh release list is not guaranteed to be sorted by semantic version.
          LATEST=$( (
            gh release list --limit 100 --json tagName -q '.[].tagName' 2>/dev/null || true
            git ls-remote --tags origin 2>/dev/null | awk -F/ '{print $3}' || true
          ) | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 )
          if [ -z "$LATEST" ]; then
            LATEST="0.0.0"
          fi
          echo "Previous release: $LATEST"

          # Parse semver
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
          BUMP="${{ needs.detect.outputs.type }}"

          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          VERSION="${MAJOR}.${MINOR}.${PATCH}"

          # Use GitHub run number as versionCode (always increasing)
          VERSION_CODE=${{ github.run_number }}

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Next release: v${VERSION} (code: ${VERSION_CODE}, bump: ${BUMP})"

      - name: Inject version into build.gradle.kts
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ steps.version.outputs.code }}/" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"${{ steps.version.outputs.version }}\"/" app/build.gradle.kts
          echo "Updated build.gradle.kts:"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          # ubuntu-latest ships a preinstalled Android SDK; android-actions/setup-android
          # is broken (still installs the removed legacy "tools" package), so expose
          # the preinstalled SDK to gradle/adb instead.
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "Using Android SDK at $ANDROID_HOME"

      - name: Bundle cloudflared binary
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          # Same binary as android.yml: Termux's cloudflared is linked against
          # Android's bionic libc, so DNS goes through netd like a normal app.
          # The official static linux-arm64 release does its own DNS via
          # /etc/resolv.conf (absent on Android) and can trip Android's seccomp
          # filter, so it must not ship in the release APK.
          curl -fsSL https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages -o packages.idx
          DEB=$(awk '/^Package: cloudflared$/{c=1} c && /^Filename:/{print $2; exit}' packages.idx)
          curl -fsSL "https://packages.termux.dev/apt/termux-main/$DEB" -o cloudflared.deb
          mkdir -p deb && cd deb
          ar x ../cloudflared.deb
          tar -xJf data.tar.xz
          cd ..
          cp deb/data/data/com.termux/files/usr/bin/cloudflared app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/release.keystore

      - name: Create keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          sed -i 's/^[[:space:]]*//' keystore.properties

      - name: Build signed Release APK
        run: ./gradlew assembleRelease

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          APK_NAME="castla-${VERSION}.apk"
          mv "$APK_PATH" "app/build/outputs/apk/release/${APK_NAME}"

          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            --latest \
            "app/build/outputs/apk/release/${APK_NAME}"
